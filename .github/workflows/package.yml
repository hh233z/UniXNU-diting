name: package

# docs/porting/packaging.md template, with this board's firmware checkout and the
# pinned UniXNU commit (main HEAD's drivers/ArmCpu gitlink is not served).

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["ipados-18.7.10-22H374"]
        default: "ipados-18.7.10-22H374"
      defconfig:
        description: "Kernel defconfig; bringup pairs with the prepared OS"
        type: choice
        options: ["diting_ipados18_ci_defconfig", "diting_ipados18_bringup_defconfig"]
        default: "diting_ipados18_ci_defconfig"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}-${{ inputs.defconfig }}
  cancel-in-progress: true

jobs:
  firmware:
    # Mu-Basetools in this tree has no macOS x86 support (stuart update refuses the host),
    # so the volume is built on Linux and handed to the macOS packaging job.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - name: build the diting volume
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential uuid-dev iasl nasm python3-venv mono-complete llvm lld
          # Ubuntu ships versioned llvm tools; BootShim's Makefile calls the bare names.
          for t in llvm-objcopy llvm-objdump llvm-readelf clang clang++; do
            if ! command -v "$t" >/dev/null 2>&1; then
              src=$(ls /usr/bin/$t-* 2>/dev/null | sort -V | tail -1)
              [ -n "$src" ] && sudo ln -sf "$src" "/usr/local/bin/$t"
            fi
          done
          llvm-objcopy --version | head -1
          git clone --filter=blob:none https://github.com/Emilelu/uefi-mondrian.git uefi-mondrian
          cd uefi-mondrian
          git checkout e06211de59325bbd086c312324bdbf40e21d1045
          # build_uefi.py only updates submodules with -u; the packages the DSC lists must exist.
          git submodule update --init --depth 1 Binaries Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI
          # stuart setup skips a dirty submodule. The logger edit below dirties Mu_Basecore,
          # so the nested modules (mipisyst and the rest) have to be fetched first.
          git -C Mu_Basecore submodule update --init --depth 1 --recursive
          # Mu's DxeMain never consumes AdvancedLoggerLib, so the DXE log buffer is never
          # created and the Tools plugin reports "no log". Insert the library class where the
          # DXE core links it; DxeCore keeps its own framebuffer DebugLib.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Mu_Basecore/MdeModulePkg/Core/Dxe/DxeMain.inf")
          data = path.read_bytes()
          if b"AdvancedLoggerLib" in data:
              print("AdvancedLoggerLib already present")
          else:
              nl = b"\r\n" if b"\r\n" in data else b"\n"
              marker = b"[Guids]" + nl
              assert marker in data, "DxeMain.inf has no [Guids] section"
              add = b"  AdvancedLoggerLib         ## UniXNU: create the DXE Advanced Logger buffer" + nl
              data = data.replace(marker, add + nl + marker, 1)
              path.write_bytes(data)
              print("AdvancedLoggerLib inserted")
          PY
          cp -r ../device/platform-firmware/ditingPkg Platforms/Xiaomi/ditingPkg
          # build_uefi.py packs Resources/DTBs/<device>.dtb into the volume.
          mkdir -p Resources/DTBs
          cp ../device/platform-firmware/ditingPkg/FdtBlob/sm8475-xiaomi-diting.dtb Resources/DTBs/diting.dtb
          # build_uefi.py runs mkbootimg with --ramdisk Resources/ramdisk; the volume build
          # does not need payload contents, but the file must exist.
          : > Resources/ramdisk
          cp ../device/platform-firmware/diting.toml Resources/Configs/diting.toml
          git apply ../device/platform-firmware/darwin-boot-diting.patch
          # A failed first LocateProtocol used to stick for the life of the driver,
          # so DarwinBoot's later DEBUG_ERROR lines never reached the buffer.
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Common/Mu/AdvLoggerPkg/Library/AdvancedLoggerLib/Dxe/AdvancedLoggerLib.c")
          data = path.read_bytes()
          nl = b"\r\n" if b"\r\n" in data else b"\n"
          old = b"  if (!mInitialized) {" + nl + b"    mInitialized = TRUE;" + nl
          if old not in data:
              done = b"} else {" + nl + b"        mInitialized = TRUE;"
              if done in data:
                  print("logger latch already retried")
              else:
                  raise SystemExit("AdvancedLoggerLib.c latch site not found")
          else:
              data = data.replace(old, b"  if (!mInitialized) {" + nl, 1)
              needle = (
                  b"        Status = EFI_NOT_FOUND;" + nl
                  + b"      }" + nl
                  + b"    }" + nl
              )
              insert = (
                  b"        Status = EFI_NOT_FOUND;" + nl
                  + b"      } else {" + nl
                  + b"        mInitialized = TRUE;" + nl
                  + b"      }" + nl
                  + b"    }" + nl
              )
              if needle not in data:
                  raise SystemExit("AdvancedLoggerLib.c signature check not found")
              path.write_bytes(data.replace(needle, insert, 1))
              print("logger locate retries until the protocol exists")
          boot = Path("Platforms/Xiaomi/DarwinBootPkg/Driver/DarwinBoot.c")
          text = boot.read_bytes()
          bnl = b"\r\n" if b"\r\n" in text else b"\n"
          prints = [
              b'Print (L"DARWINBOOT: unsupported inputs or exception level; firmware retained\\n");',
              b'Print (L"DARWINBOOT: inputs validated; exiting boot services\\n");',
              b'Print (L"DARWINBOOT: boot refused: %r; firmware retained\\n", Status);',
          ]
          for line in prints:
              if line not in text:
                  raise SystemExit("missing DarwinBoot line: " + line.decode())
              debug = b"DEBUG ((DEBUG_ERROR, " + line[len(b"Print (L"):-2] + b"));"
              if debug in text:
                  continue
              text = text.replace(line, debug + bnl + line, 1)
          boot.write_bytes(text)
          print("DarwinBoot Print lines mirrored to DEBUG_ERROR")
          PY
          python3 -m venv "$RUNNER_TEMP/uefi-venv"
          . "$RUNNER_TEMP/uefi-venv/bin/activate"
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet -r pip-requirements.txt
          # GitHub-hosted runners still get HTTP 504 for these two release assets.
          # The device repo carries the upstream archives. Seeding extdep_state.yaml
          # makes stuart update treat them as already resolved.
          python3 ../device/platform-firmware/seed-ext-deps.py \
            ../device/platform-firmware/vendor \
            .
          # Retry the build itself. A seeded ext_dep is not downloaded again.
          for attempt in 1 2 3; do
            if python3 build_uefi.py -d diting; then
              break
            fi
            echo "firmware build attempt $attempt failed; retrying"
            sleep 30
          done
          test -f Build/ditingPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd
          FD="Build/ditingPkg/RELEASE_CLANGPDB/FV/SILICIUM_UEFI.fd"
          [ -f "$FD" ] || { echo "missing firmware volume: $FD" >&2; exit 1; }
          sha256sum "$FD"; ls -l "$FD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$FD" "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd"
          # The macOS job packs the self-contained image and has no firmware tree.
          cp BootShim/BootShim.bin "$GITHUB_WORKSPACE/out/BootShim.bin"
          cp Resources/Scripts/mkbootimg.py "$GITHUB_WORKSPACE/out/mkbootimg.py"
          cp Resources/Configs/diting.toml "$GITHUB_WORKSPACE/out/diting.toml"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: firmware-logs
          path: |
            uefi-mondrian/Build/BUILDLOG_*.txt
            uefi-mondrian/Build/*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: diting-fd
          path: out/
          if-no-files-found: error
  package:
    needs: firmware
    # The Diting component recipes build with Xcode and refuse a non-x86_64 Darwin host.
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diting-fd
          path: firmware-fd
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          # Fork of UniXNU at c96b299 with one added commit: the shared kernel step takes
          # MACHINE_CONFIGS from board.toml [kernel] machine_config instead of hardcoding
          # BCM2837, which this board cannot build (its patches add MASTER.arm64.diting).
          # c96b299 is used rather than main because main HEAD points drivers/ArmCpu at
          # 2e11cda, which the submodule remote does not serve.
          repository: nagatoquin33/UniXNU
          ref: 0ce9779c2aa7c4f85fdc7f7610bcd0cfc2fde8e2
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Emilelu/uefi-mondrian
          ref: e06211de59325bbd086c312324bdbf40e21d1045
          path: uefi-diting
          submodules: false
      - name: diting firmware tree
        # One firmware source for local and CI: the pinned Mu-Silicium tree plus the device's
        # ditingPkg, DT and config; the DarwinBoot driver patch is applied before EDK II runs.
        run: |
          set -euo pipefail
          cd uefi-diting
          git submodule update --init --depth 1 Binaries Common/Mu Common/Mu_OEM_Sample Mu_Basecore Silicium-ACPI
          git -C Mu_Basecore submodule update --init --depth 1 --recursive
          mkdir -p Platforms/Xiaomi/ditingPkg
          cp -R ../device/platform-firmware/ditingPkg/. Platforms/Xiaomi/ditingPkg/
          mkdir -p Resources/DTBs
          cp ../device/platform-firmware/ditingPkg/FdtBlob/sm8475-xiaomi-diting.dtb Resources/DTBs/diting.dtb
          : > Resources/ramdisk
          cp ../device/platform-firmware/diting.toml Resources/Configs/diting.toml
          git apply ../device/platform-firmware/darwin-boot-diting.patch
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools
          # blacktop/tap's ipsw cask does not load with current Homebrew:
          #   Cask 'ipsw' definition is invalid: invalid 'zap' stanza: wrong number of arguments
          # so take the CLI from the release tarball instead.
          # Pinned, not "latest": the GitHub API is rate limited without a token (403) and
          # the build must use the same tool version every run.
          ipsw_ver=3.1.743
          # The runner lost DNS once (curl: 6) mid-download; retry instead of failing the run.
          for attempt in 1 2 3 4 5; do
            curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 \
              "https://github.com/blacktop/ipsw/releases/download/v${ipsw_ver}/ipsw_${ipsw_ver}_macOS_x86_64.tar.gz" -o /tmp/ipsw.tar.gz \
              && break
            echo "ipsw download attempt $attempt failed"; sleep 5
          done
          sudo tar -xzf /tmp/ipsw.tar.gz -C /usr/local/bin ipsw
          ipsw version
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/usr/local/opt/llvm/bin/$t" ] || [ -f "/usr/local/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: volume layout
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/volume-layout.json" <<'PY'
          import json, os, sys, tomllib
          from pathlib import Path
          profile = tomllib.loads(Path('device/os-profiles/ipados-18.7.10-22H374/profile.toml').read_text())
          root = profile['root']
          layout = {
              'ci_placeholder': True,
              'build': '22H374',
              'lba_bytes': 4096,
              'os': {'uuid': root['os_volume_uuid']},
              'systemos': {'uuid': root['systemos_volume_uuid']},
              # The Data UUID recorded from the generated userdata layout; the placeholder
              # bf5d77f3-... is gone, so the kernel, the payload and this file agree.
              'data': {'uuid': '337CF716-F62B-446B-B959-4A5F12A7701C'},
          }
          Path(sys.argv[1]).write_text(json.dumps(layout, indent=2))
          # The UUIDs are compiled into the kernel (kern_exec selects the volumes by them), so
          # write the same values into the selected defconfig before the build reads it.
          conf = Path('device/configs') / os.environ['DEFCONFIG']
          text = conf.read_text()
          for key, value in (('CONFIG_XNU_OWNER_ROOT_VOLUME_UUID', root['os_volume_uuid']),
                             ('CONFIG_XNU_OWNER_CACHE_VOLUME_UUID', root['systemos_volume_uuid']),
                             ('CONFIG_XNU_OWNER_DATA_VOLUME_UUID', layout['data']['uuid'])):
              import re as _re
              text = _re.sub(key + r'=".*"', key + '="' + value + '"', text)
          conf.write_text(text)
          print([l for l in text.splitlines() if 'VOLUME_UUID' in l])
          print(json.dumps(layout))
          PY
      - name: select the defconfig
        # [package.defconfig] only selects the release configuration; the kernel component
        # reads [kernel] defconfig, which is the shipping one (Wi-Fi, backlight, Adreno on).
        # The selected defconfig comes from the workflow input: the bringup one pairs with
        # the prepared 22H374 userland (SystemOS at /private/preboot). The release command
        # derives its output directory from this mapping, so the check below must pass.
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
          OS: ${{ inputs.os }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          from pathlib import Path
          ci = os.environ['DEFCONFIG']
          p = Path('device/board.toml')
          text = p.read_text()
          pairs = [
              ('defconfig = "diting_ipados18_defconfig"', 'defconfig = "' + ci + '"'),
              ('"ipados-18.7.10-22H374" = "diting_ipados18_defconfig"',
               '"ipados-18.7.10-22H374" = "' + ci + '"'),
          ]
          for before, after in pairs:
              if before in text:
                  text = text.replace(before, after, 1)
                  print('selected', after)
              else:
                  print('already selected:', after)
          p.write_text(text)
          mapped = tomllib.loads(text).get('package', {}).get('defconfig', {}).get(os.environ['OS'])
          if mapped != ci:
              raise SystemExit('[package.defconfig] selects %r, not %r; the output paths would diverge' % (mapped, ci))
          print('release selects', ci)
          PY
      - name: install device profile and components
        # The board carries its own OS profile and kit; unixnu resolves both from its own
        # checkout, so install them before release resolves board.os_profile.
        run: python3 device/scripts/install-unixnu-inputs.py --unixnu UniXNU
      - name: gpu firmware
        env:
          A1: ${{ secrets.ADRENO_FW_1 }}
          A2: ${{ secrets.ADRENO_FW_2 }}
          A3: ${{ secrets.ADRENO_FW_3 }}
          A4: ${{ secrets.ADRENO_FW_4 }}
          A5: ${{ secrets.ADRENO_FW_5 }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/adreno730"
          mkdir -p "$out"
          python3 - "$out" <<'PY'
          import base64, os, struct, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          names = ['a730_sqe.fw','gmu_gen70000.bin','a730_zap.mdt','a730_zap.b01','a730_zap.b02']
          blob = base64.b64decode(''.join(os.environ['A%d' % i] for i in range(1, 6)))
          at = 0
          for name in names:
              size = struct.unpack_from('<I', blob, at)[0]; at += 4
              (out / name).write_bytes(blob[at:at + size]); at += size
              print(name, size)
          PY
          ls -l "$out"
      - name: wifi sources
        # 按设备仓库清单固定三份源码，并一次检查 ath11k、MHI、QMI 依赖。
        run: >-
          python3 device/scripts/prepare-ci-wifi.py
          --workspace "$GITHUB_WORKSPACE"
          --manifest device/configs/diting-native-sources.toml
      - name: preflight Wi-Fi compile
        env:
          UNIXNU_DEVICE: ${{ github.workspace }}/device
          DITING_WIFI_SOURCE: ${{ github.workspace }}/linux
          DITING_WIFI_SHARED: ${{ github.workspace }}/sheng/drivers/Ath12kWifi
          DITING_WIFI_FIRMWARE: ${{ github.workspace }}/device/platform-firmware/wifi
          DITING_HARDWARE_DTB: ${{ runner.temp }}/diting-live.dtb
          # docs/guide/debugging: colour bars under the green DarwinBoot bar tell us how
          # far the kernel got; a reset once the MMU is on proves it passed that point.
          # 入口探针在这个内核上还没安装成功：patch-xnu-entry-probe.py 需要的填充区
          # (0xfffffff0074a6518) 在我们的核心里已被占用，脚本直接退出。
          # 先用 0 保持构建可用，等换到空闲段或改用串口再打开。
          DITING_ENTRY_PROBE: "0"
        run: |
          set -euo pipefail
          export PATH="/usr/local/opt/llvm/bin:/usr/local/opt/lld/bin:$PATH"
          python3 device/kits/DitingPlatform24/build-with-runtime.py --overlay-only --overlay-dir "$RUNNER_TEMP/wifi-overlay"
          python3 "$RUNNER_TEMP/wifi-overlay/scripts/build-diting-ath11k.py" --output-dir "$GITHUB_WORKSPACE/wifi-preflight" --jobs 4
      - name: diting hardware tree
        # The live tree names the Wi-Fi reset/enable/wake lines differently from Diting and
        # its PCIe refgen clock sits at another index; apply.py bakes the device values in.
        run: |
          set -euo pipefail
          python3 device/platform-firmware/dtb-fixups/apply.py \
            device/platform-firmware/diting-live.dts "$RUNNER_TEMP/diting-live.dts"
          dtc -I dts -O dtb -o "$RUNNER_TEMP/diting-live.dtb" "$RUNNER_TEMP/diting-live.dts"
          ls -l "$RUNNER_TEMP/diting-live.dtb"
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          DITING_ADRENO_FIRMWARE: ${{ runner.temp }}/adreno730
          DITING_VOLUME_LAYOUT: ${{ runner.temp }}/volume-layout.json
          # The UFS storage imports are read from the decompressed 22H374 kernelcache the
          # deps step extracts; the device script's default is a workstation path.
          DITING_KERNELCACHE: ${{ github.workspace }}/UniXNU/out/ipsw/22H374/kernelcache.decompressed
          DITING_WIFI_FIRMWARE: ${{ github.workspace }}/device/platform-firmware/wifi
          DITING_HARDWARE_DTB: ${{ runner.temp }}/diting-live.dtb
          DITING_WIFI_SOURCE: ${{ github.workspace }}/linux
          DITING_SHENG_ROOT: ${{ github.workspace }}/sheng
          # the recipes resolve the shared ABI through diting_native_inputs, not sheng_root
          DITING_WIFI_SHARED: ${{ github.workspace }}/sheng/drivers/Ath12kWifi
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-diting --fd "$GITHUB_WORKSPACE/firmware-fd/SILICIUM_UEFI.fd"
      - name: v4 container
        # docs/porting/packaging.md stops at boot/boot.img (header v0). The flashable image the
        # firmware accepts is the PONGFAT1 envelope finalize-diting-adt.py writes.
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          CONFIG="${DEFCONFIG%_defconfig}"
          WORK="$GITHUB_WORKSPACE/UniXNU/out/diting/${{ inputs.os }}/$CONFIG"
          [ -f "$WORK/kernel/kernel.macho" ] || { echo "no kernel at $WORK/kernel/kernel.macho; out/diting/${{ inputs.os }} holds:" >&2; ls -1 "$GITHUB_WORKSPACE/UniXNU/out/diting/${{ inputs.os }}" >&2 || true; exit 1; }
          python3 scripts/check-storage-bindings.py "$WORK/kernel/kernel.macho"
          DTB="$WORK/device-tree/build/diting/hardware.dtb"
          [ -f "$DTB" ] || { echo "missing hardware DTB: $DTB" >&2; exit 1; }
          python3 scripts/finalize-diting-adt.py \
            --work-dir "$WORK" \
            --uefi "$GITHUB_WORKSPACE/uefi-diting" \
            --unique-chip-id "$UNIXNU_UNIQUE_CHIP_ID" \
            --volume-layout "$RUNNER_TEMP/volume-layout.json" \
            --hardware-dtb "$DTB" \
            --ufs-probe
          ls -l "$WORK/boot"
      - name: self-contained v4 (shim + firmware)
        # finalize-diting-adt.py leaves the kernel slot empty because a Diting device boots the
        # firmware from its own partition. A fastboot-boot candidate needs the shim and the
        # volume in that slot, which scripts/build-bootimg.py already builds.
        working-directory: device
        env:
          DEFCONFIG: ${{ inputs.defconfig }}
        run: |
          set -euo pipefail
          # llvm is keg-only in Homebrew; llvm-objcopy was not on PATH.
          export PATH="/usr/local/opt/llvm/bin:/usr/local/opt/lld/bin:$PATH"
          CONFIG="${DEFCONFIG%_defconfig}"
          WORK="$GITHUB_WORKSPACE/UniXNU/out/diting/${{ inputs.os }}/$CONFIG"
          # The firmware built two steps above, not the Diting baseline.
          FD="$GITHUB_WORKSPACE/firmware-fd/SILICIUM_UEFI.fd"
          DTB="$WORK/device-tree/build/diting/hardware.dtb"
          [ -f "$FD" ] || { echo "missing firmware volume: $FD" >&2; exit 1; }
          [ -f "$DTB" ] || { echo "missing hardware DTB: $DTB" >&2; exit 1; }
          # DitingBootMemoryDxe validates the PONGFAT1 envelope, not a bare FAT volume, so
          # take the envelope the v4 container already carries instead of payload.img.
          python3 - "$WORK/boot/diting-xnu-initial.img" "$RUNNER_TEMP/payload-envelope.img" <<'PY'
          import struct, sys
          from pathlib import Path
          img = Path(sys.argv[1]).read_bytes()
          ks, rs = struct.unpack_from("<2I", img, 8)
          hdr, = struct.unpack_from("<I", img, 20)
          off = ((hdr + 4095)//4096)*4096 + ((ks + 4095)//4096)*4096
          data = img[off:off+rs]
          assert data[:8] == b"PONGFAT1", "the v4 ramdisk is not a PONGFAT1 envelope"
          Path(sys.argv[2]).write_bytes(data)
          print("envelope", len(data))
          PY
          python3 scripts/build-bootimg.py \
            --shim "$GITHUB_WORKSPACE/firmware-fd/BootShim.bin" \
            --mkbootimg "$GITHUB_WORKSPACE/firmware-fd/mkbootimg.py" \
            --config "$GITHUB_WORKSPACE/firmware-fd/diting.toml" \
            --fd "$FD" \
            --dtb "$DTB" \
            --ramdisk "$RUNNER_TEMP/payload-envelope.img" \
            --output-dir "$WORK/boot"
          ls -l "$WORK/boot"
      - name: keep the logs
        if: always()
        run: |
          mkdir -p products/logs
          # Every log the run produced, not only logs/: the component recipe writes
          # build-<stamp>.log beside the configuration directory.
          for root in UniXNU/out/diting wifi-preflight; do
            [ -d "$root" ] || continue
            find "$root" -type f \( -name '*.log' -o -name 'compile-commands.json' -o -name 'undefined-symbols.txt' \) | while read -r f; do
              cp -f "$f" "products/logs/$(printf '%s' "$f" | tr '/' '_')"
            done
          done
      - name: logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: products/logs/*
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/diting/*/*/boot/boot.img
            UniXNU/out/diting/*/*/boot/diting-xnu-initial.img
            UniXNU/out/diting/*/*/boot/diting-unixnu-uefi.img
            UniXNU/out/diting/*/*/payload/payload.img
            UniXNU/out/diting/*/*/kernel/kernel.macho
            UniXNU/out/diting/*/*/package.manifest.json
            products/logs/*
