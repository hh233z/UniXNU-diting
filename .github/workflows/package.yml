name: package

# The template from docs/porting/packaging.md (UniXNU examples/device/.github/workflows/package.yml).
# The board changes board.toml, never the script: scripts/package.sh is the verbatim copy of
# UniXNU/templates/package.sh. The platform seed comes from the repository secret
# UNIXNU_UNIQUE_CHIP_ID and is baked into the images, so the artifacts belong to one device:
# download them, then delete the run.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["ipados-18.7.10-22H374"]
        default: "ipados-18.7.10-22H374"

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    # The Pong component recipes build with Xcode and refuse a non-x86_64 Darwin host.
    runs-on: macos-15-intel
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Chengdong-Yu/uefi-pong
          path: uefi-pong
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools blacktop/tap/ipsw
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy; do
            [ -f "/usr/local/opt/llvm/bin/$t" ] || [ -f "/usr/local/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-pong
      - name: keep the logs
        if: always()
        run: |
          mkdir -p products/logs
          find UniXNU/out/diting -type f -path '*/logs/*' -exec cp -f {} products/logs/ \; 2>/dev/null || true
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: |
            UniXNU/out/diting/*/*/boot/boot.img
            UniXNU/out/diting/*/*/payload/payload.img
            UniXNU/out/diting/*/*/kernel/kernel.macho
            UniXNU/out/diting/*/*/package.manifest.json
            products/logs/*
