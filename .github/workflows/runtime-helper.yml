name: Diting runtime helper

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helper:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build 22H374 helper and adapters
        run: |
          python3 userland/build-ipados18.py helper \
            --out "$RUNNER_TEMP/diting-runtime" \
            --developer "$DEVELOPER_DIR"
      - name: Upload project-built runtime components
        uses: actions/upload-artifact@v4
        with:
          name: diting-runtime-22H374
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/diting-runtime/init
            ${{ runner.temp }}/diting-runtime/libditing-ui.dylib
            ${{ runner.temp }}/diting-runtime/sleepserver
            ${{ runner.temp }}/diting-runtime/DitingAudio.driver/
            ${{ runner.temp }}/diting-runtime/sileo-register
            ${{ runner.temp }}/diting-runtime/sileo-root
            ${{ runner.temp }}/diting-runtime/phone-register
            ${{ runner.temp }}/diting-runtime/audio-route
            ${{ runner.temp }}/diting-runtime/sileo-firstboot.sh
            ${{ runner.temp }}/diting-runtime/sileo-rootful-firstboot.sh
            ${{ runner.temp }}/diting-runtime/var-seed/
            ${{ runner.temp }}/diting-runtime/helper.json
